<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zaloguj się</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .bi-house-lock {
            font-size: 10rem;
        }
    </style>
</head>
<body>
<nav th:insert="~{fragments :: nav}"></nav>
<div class="container">
    <div class="row text-center">
        <h1 class="login-header">Zaloguj się</h1>
        <i class="bi bi-house-lock"></i>
    </div>
    <div class="row text-center justify-content-center">
        <div class="col-3">
            <form class="login-form" th:action="@{/login}" method="post">
                <input name="username" placeholder="nazwa użytkownika" class="form-control mb-2">
                <input name="password" placeholder="hasło" type="password" class="form-control mb-2">
                <button type="submit" class="btn btn-secondary">Zaloguj się</button>
            </form>
        </div>
    </div>
</div>
<footer th:insert="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
