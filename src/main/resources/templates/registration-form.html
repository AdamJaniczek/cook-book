<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularz rejestracji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .bi-person-fill-add {
            font-size: 10rem;
        }
    </style>
</head>
<body>
<nav th:insert="~{fragments :: nav}"></nav>
<div class="container">
    <div class="row text-center">
        <h1 class="login-header">Zarejestruj się</h1>
        <i class="bi bi-person-fill-add"></i>
    </div>
    <div class="row text-center justify-content-center">
        <div class="col-3">
            <form class="login-form" th:action="@{/register}" method="post" th:object="${user}">
                <input th:field="${user.firstName}" placeholder="np. Jan" class="form-control mb-2" required>
                <input th:field="${user.lastName}" placeholder="np. Kowalski" class="form-control mb-2" required>
                <input th:field="${user.email}" placeholder="np. jankowalski@gmail.com" class="form-control mb-2" required>
                <input th:field="${user.password}" type="password" placeholder="Hasło" class="form-control mb-2" required>
                <button type="submit" class="btn btn-secondary">Zarejestruj się</button>
            </form>
        </div>
    </div>
</div>
<footer th:insert="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
